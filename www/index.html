<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>CallApp-1</title>
        <style>
        body {
            text-align: center; /* centra tutto orizzontalmente */
            font-family: Arial, sans-serif;
        }

        button {
            background-color: red;
            color: white;
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background-color: darkred;
        }
    </style>
</head>
<body>
<h1>Test server Java</h1>
<button onclick="callServer()">Chiama server!!!!</button>

<pre id="output"></pre>

<script>
    function callServer() {
      //fetch("https://localhost:8080")
      fetch("https://callapp-1-znj8.onrender.com/")      
        .then(r => r.json())
        .then(data => {
          document.getElementById("output").textContent =
            JSON.stringify(data, null, 2);
        })
        .catch(err => console.error(err));
    }
</script>
</body>
</html>
