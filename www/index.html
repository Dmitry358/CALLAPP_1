<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Mini Chat</title>
<style>
body { font-family: Arial; text-align: center; }
#chat { width: 60%; margin: 20px auto; border: 1px solid #ccc; padding: 10px; text-align: left; min-height: 200px; }
input { width: 60%; padding: 10px; }
button { padding: 10px 20px; margin-top: 10px; }
</style>
</head>
<body>
<h1>Mini Chat Socket</h1>

<div id="chat"></div>
<input id="textInput" placeholder="Scrivi..." />
<button onclick="send()">Invia</button>

<script>
function send() {
    const input = document.getElementById("textInput");
    const msg = input.value.trim();
    if (!msg) return;

    fetch("/send?msg=" + encodeURIComponent(msg))
        .then(r => r.text())
        .then(() => { input.value = ""; });
}

// Aggiorna chat ogni secondo
setInterval(() => {
    fetch("/messages")
        .then(r => r.text())
        .then(data => {
            const chat = document.getElementById("chat");
            chat.innerHTML = "";
            data.split("\n").filter(line => line).forEach(line => {
                const p = document.createElement("p");
                p.textContent = line;
                chat.appendChild(p);
            });
        });
}, 1000);
</script>
</body>
</html>
